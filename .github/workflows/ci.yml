# Tests à chaque push et pull request : lint, format, tests serveur, puis parcours dans Chrome (Playwright).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint et format
        run: npm run lint && npm run format:check
      - name: Tests serveur
        run: npm test
      - name: Navigateur pour Playwright
        run: npx playwright install --with-deps chrome
      - name: Parcours dans le navigateur
        run: npm run test:e2e
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
