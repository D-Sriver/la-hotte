<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)" />
    <title>Pas de connexion · La Hotte</title>
    <style>
      :root {
        --bg: #eceef3;
        --tile: #fff;
        --ink: #141a2e;
        --ink-soft: #4f566a;
        --red: #d93236;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1020;
          --tile: #181c30;
          --ink: #f2f3f8;
          --ink-soft: #b9bed0;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          1rem/1.5 -apple-system,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        border-radius: 28px;
        background: var(--tile);
        text-align: center;
      }
      h1 {
        margin: 0.8rem 0 0.4rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.4rem;
        color: var(--ink-soft);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1.4rem;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>Pas de connexion</h1>
      <p>La Hotte a besoin d’Internet pour afficher les listes. Vérifie le Wi-Fi ou les données mobiles.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
