name = "la-hotte"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "la-hotte"
database_id = "874fe530-e678-4ab7-be0d-fa3d2d6c77d7"   # donné par `wrangler d1 create la-hotte`

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/openai/gpt-oss-120b"
IDEAS_PER_DAY = "10"
PRICE_SEARCHES_PER_MONTH = "200" # palier gratuit SerpApi : 250
FAMILY_IDEAS_PER_DAY = "40"
FAMILY_PRICE_SEARCHES_PER_MONTH = "40"
# Secret SERPAPI_KEY (wrangler pages secret put) : sans lui, pas de recherche de prix.
# ACCESS_TEAM_DOMAIN et ACCESS_AUD : à mettre dans le dashboard Pages (voir README)
