name = "la-hotte"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "la-hotte"
database_id = "REMPLACE_PAR_TON_ID"   # donné par `wrangler d1 create la-hotte`

[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"
IDEAS_PER_DAY = "20"
# ACCESS_TEAM_DOMAIN et ACCESS_AUD : à mettre dans le dashboard Pages (voir README)
